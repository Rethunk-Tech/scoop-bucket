name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gate tools
        run: |
          # ubuntu-latest's apt shellcheck lags; pin the same release local `gate` uses.
          curl --proto '=https' --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          curl --proto '=https' --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          curl --proto '=https' --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/gate" https://github.com/Rethunk-Tech/rethunk-gate-cli/releases/download/v0.6.7/gate-linux-amd64
          echo "14e384a1ddacd7366aa1e9f4f8ab535de2ef19bef2d032fb8ed7b96abe9437e4  $RUNNER_TEMP/gate" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/gate" /usr/local/bin/gate
          sudo apt-get update
          sudo apt-get install -y gnupg
      - name: gate
        run: gate
